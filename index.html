<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riganti, Geiler & Márquez Alluralde - Abogados</title>
    <!-- Fuentes Corporativas de Élite -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* --- VARIABLES DE DISEÑO PREMIUM (ESTILO MARVAL & BECCAR VARELA) --- */
        :root {
            --color-primario: #070e1b;   /* Azul medianoche profundo */
            --color-secundario: #c5a880; /* Dorado satinado institucional */
            --color-fondo-claro: #f8fafc;/* Gris premium ultra limpio */
            --color-texto-oscuro: #1e293b;
            --color-texto-suave: #64748b; 
            --fuente-titulos: 'Cinzel', serif;
            --fuente-cuerpo: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--fuente-cuerpo);
            color: var(--color-texto-oscuro);
            background-color: #ffffff;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        /* --- ENCABEZADO INSTITUCIONAL --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 12%;
            background-color: var(--color-primario);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(197, 168, 128, 0.2);
        }

        .marca-estudio {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0;
            height: auto;
        }

        .logo-premium {
            height: 48px;                 /* Altura institucional */
            width: auto;                  
            max-width: 56px;              
            display: block;
            flex-shrink: 0;               
            margin-right: 20px;           /* Espacio exacto antes de la barra dorada */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* LÍNEA VERTICAL DIVISORIA EN ORO INSTITUCIONAL */
        .divisor-marca {
            height: 38px;                 
            width: 1.5px;                 
            background: linear-gradient(to bottom, transparent 0%, var(--color-secundario) 50%, transparent 100%);
            margin-right: 20px;           /* Separación exacta antes de los apellidos */
            flex-shrink: 0;               
            opacity: 0.85;                
        }

        /* FORZADO TIPOGRÁFICO: Fuentes romanas clásicas con serifas */
        .nombre-estudio {
            font-family: var(--fuente-titulos) !important; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .nombre-estudio .apellido-principal {
            display: block;
            font-weight: 500;
            font-size: 1.2rem;            
            letter-spacing: 2px;
            line-height: 1.2;
            color: #ffffff !important;
        }

        .nombre-estudio .apellido-secundario {
            display: block;
            font-weight: 400;
            font-size: 0.85rem;
            letter-spacing: 2.5px;
            color: rgba(255, 255, 255, 0.8) !important;
            margin-top: 2px;
            line-height: 1.2;
        }

        /* --- ENLACES DE LA NAV --- */
        nav ul {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        nav ul li a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 2px;
            transition: color 0.3s ease;
            position: relative;
            padding: 4px 0;
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background-color: var(--color-secundario);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav ul li a:hover {
            color: var(--color-secundario);
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        /* --- PORTADA PRINCIPAL --- */
        .hero-principal {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; 
            text-align: center;
            padding: 140px 8% 180px 8%;
            clip-path: polygon(0 0, 100% 0, 100% 85vh, 0 100%);
            -webkit-clip-path: polygon(0 0, 100% 0, 100% 85vh, 0 100%);
        }

        .hero-principal h1 {
            font-family: var(--fuente-titulos);
            font-size: 3rem;
            color: #ffffff;
            font-weight: 400;
            max-width: 950px;
            line-height: 1.35;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .hero-principal p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 1.15rem;
            font-weight: 300;
            max-width: 700px;
            text-align: center;          
            margin: 0 auto 45px auto;    
        }

        .boton-premium {
            display: inline-block;
            padding: 16px 45px;
            border: 1px solid var(--color-secundario);
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            font-weight: 500;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: transparent;
        }

        .boton-premium:hover {
            background-color: var(--color-secundario);
            color: var(--color-primario);
            box-shadow: 0 15px 30px rgba(197, 168, 128, 0.2);
        }

        /* --- SECCIONES ESTRUCTURALES GENERALES --- */
        section {
            padding: 140px 12%;
            clear: both;
        }

        .encabezado-seccion {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 90px auto;
        }

        .encabezado-seccion h2 {
            font-family: var(--fuente-titulos);
            font-size: 2.4rem;
            color: var(--color-primario);
            font-weight: 500;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .encabezado-seccion .linea-decorativa {
            width: 40px;
            height: 1px;
            background-color: var(--color-secundario);
            margin: 0 auto 25px auto;
        }

        .encabezado-seccion p {
            color: var(--color-texto-suave);
            font-size: 1rem;
        }

        /* --- CONTENEDORES INTERNOS --- */
        .contenedor-estudio {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 70px;
            align-items: center;
        }

        .texto-estudio p {
            color: var(--color-texto-oscuro);
            margin-bottom: 25px;
            font-size: 1.05rem;
            text-align: justify;
            font-weight: 300;
        }

        .lista-valores {
            display: grid;
            grid-template-columns: 1fr;
            gap: 35px;
        }

        .tarjeta-valor {
            border-left: 2px solid var(--color-secundario);
            padding-left: 25px;
        }

        .tarjeta-valor h4 {
            font-family: var(--fuente-titulos);
            font-size: 1.15rem;
            color: var(--color-primario);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .tarjeta-valor p {
            color: var(--color-texto-suave);
            font-size: 0.95rem;
            font-weight: 400;
        }

        .grid-corporativo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
            height: auto; 
        }

        .tarjeta-corporativa {
            background-color: #ffffff;
            padding: 55px 40px;
            border: 1px solid #e2e8f0;
            opacity: 1; 
            transform: translateY(0);
            transition: border-color 0.5s ease, box-shadow 0.5s ease, transform 0.3s ease;
        }

        .tarjeta-corporativa:hover {
            transform: translateY(-8px);
            border-color: var(--color-secundario);
            box-shadow: 0 30px 60px rgba(7, 14, 27, 0.04);
        }

        .tarjeta-corporativa h3 {
            font-family: var(--fuente-titulos);
            color: var(--color-primario);
            font-size: 1.3rem;
            margin-bottom: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .tarjeta-corporativa p {
            color: var(--color-texto-suave);
            font-size: 0.95rem;
            line-height: 1.7;
            font-weight: 300;
        }
                /* --- CONTACTO Y FORMULARIO --- */
        .contenedor-contacto {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 70px;
        }

        .info-contacto h3 {
            font-family: var(--fuente-titulos);
            font-size: 1.5rem;
            color: var(--color-primario);
            margin-bottom: 30px;
        }

        .bloque-dato {
            margin-bottom: 25px;
        }

        .bloque-dato label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--color-secundario);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .bloque-dato p {
            font-size: 0.95rem;
        }

        .formulario-contacto {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo-ancho {
            grid-column: span 2;
        }

        .formulario-contacto input, .formulario-contacto textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #e2e8f0;
            font-family: var(--fuente-cuerpo);
            font-size: 0.85rem;
            outline: none;
            background-color: var(--color-fondo-claro);
            transition: all 0.3s;
        }

        .formulario-contacto input:focus, .formulario-contacto textarea:focus {
            border-color: var(--color-secundario);
            background-color: #ffffff;
        }

        .boton-enviar {
            grid-column: span 2;
            padding: 16px;
            background-color: var(--color-primario);
            color: #ffffff;
            border: none;
            font-family: var(--fuente-cuerpo);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .boton-enviar:hover {
            background-color: #1a2a44;
        }

        /* --- TALENTO & FOOTER --- */
        .seccion-talento {
            position: relative;
            background-size: cover;
            background-position: center center; 
            padding: 140px 12%; 
            text-align: center;
            color: #ffffff;
            font-family: var(--fuente-cuerpo);
        }

        .contenido-talento {
            max-width: 650px;
            margin: 0 auto;
        }

        .subtitulo-talento {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: var(--color-secundario);
            display: block;
            margin-bottom: 10px;
        }

        .marca-talento {
            font-size: 42px;
            font-weight: 700;
            margin: 0 0 20px 0;
            letter-spacing: 2px;
            font-family: var(--fuente-titulos);
        }

        .descripcion-talento {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        .btn-talento {
            display: inline-block;
            background-color: var(--color-secundario);
            color: var(--color-primario);
            text-decoration: none;
            padding: 14px 35px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            border-radius: 2px;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-talento:hover {
            background-color: #b0936b;
            transform: translateY(-2px);
        }

        footer {
            background-color: var(--color-primario);
            color: #ffffff;
            padding: 80px 12% 40px 12%;
            border-top: 1px solid rgba(197, 168, 128, 0.1);
        }

        .bloques-footer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 50px;
            margin-bottom: 60px;
        }

        .columna-footer h4 {
            font-family: var(--fuente-titulos);
            color: var(--color-secundario);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .columna-footer p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        .columna-footer ul {
            list-style: none;
        }

        .columna-footer ul li {
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .footer-inferior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .footer-inferior a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-inferior a:hover {
            color: var(--color-secundario);
        }

        .barra-flotante-contacto {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 2px; 
        }

        .item-flotante {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            background-color: #070e1b; 
            border-left: 2px solid #c5a880; 
            color: #ffffff;
            text-decoration: none;
            height: 50px;
            min-width: 50px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
        }

        .icono-flotante {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .texto-flotante {
            white-space: nowrap;
            padding: 0;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .item-flotante:hover {
            padding-left: 20px;
        }

        .item-flotante:hover .texto-flotante {
            opacity: 1;
            margin-right: 15px;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 992px) {
            header { padding: 20px 5%; flex-direction: column; gap: 15px; }
            nav ul { gap: 20px; }
            section { padding: 100px 5%; }
            .hero-principal { clip-path: none; -webkit-clip-path: none; padding-bottom: 100px; }
            .contenedor-estudio, .contenedor-contacto { grid-template-columns: 1fr; gap: 50px; }
            .formulario-contacto input, .formulario-contacto textarea, .boton-enviar { grid-column: span 2; }
            .barra-flotante-contacto { display: none; }
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO INSTITUCIONAL CON ISOLOGOTIPO ASIGNADO -->

            </div>

        <nav>
            <ul>
                <li><a href="#inicio">Inicio</a></li>

            </ul>
        </nav>
    </header>
